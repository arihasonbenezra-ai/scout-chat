<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1080px;height:1920px;background:#F5EAE3;font-family:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;color:#111;overflow:hidden;position:relative}
#face{position:absolute;left:50%;top:560px;width:460px;height:460px;margin-left:-230px;transform-origin:50% 50%}
.line{position:absolute;left:96px;right:96px;top:1120px;text-align:center;opacity:0}
.big{font-size:150px;font-weight:800;letter-spacing:-.04em;line-height:1}
.h{font-size:82px;font-weight:800;letter-spacing:-.035em;line-height:1.04}
.s{font-size:40px;line-height:1.35;color:#333;margin-top:22px}
.url{font-size:48px;font-weight:700;color:#E8705F;letter-spacing:-.01em}
.pill{display:inline-block;margin-top:34px;background:#111;color:#fff;border-radius:999px;padding:22px 44px;font-size:38px;font-weight:700}
.brand{position:absolute;left:84px;top:84px;display:flex;align-items:center;gap:18px;font-size:40px;font-weight:700;opacity:0}
.brand svg{width:64px;height:64px}
</style></head><body>
<div class="brand" id="brand"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="14" fill="#F26B5E"/><circle cx="11" cy="14" r="1.8" fill="#111"/><circle cx="21" cy="15" r="1.8" fill="#111"/><path d="M 12.5 21 Q 16 23.8 19.5 21" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg><span>Ezzy.</span></div>
<svg id="face" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <circle cx="16" cy="16" r="14" fill="#F26B5E"/>
  <g id="eyes"><circle id="eL" cx="11" cy="14" r="1.8" fill="#111"/><circle id="eR" cx="21" cy="15" r="1.8" fill="#111"/></g>
  <path id="mouth" d="M 12.5 21 Q 16 23.8 19.5 21" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
</svg>
<div class="line big" id="t0">Ezzy.</div>
<div class="line" id="t1"><div class="h">Your career coach.</div><div class="s">Built by recruiters and hiring managers.</div></div>
<div class="line" id="t2"><div class="h">It reads your resume.</div></div>
<div class="line" id="t3"><div class="h">Shows you where you fit.</div></div>
<div class="line" id="t4"><div class="h">Gets you ready for the interview.</div></div>
<div class="line" id="t5"><div class="h">Nothing it says is a guess.</div><div class="s">Every line points back to your resume, your answers, or a source.</div></div>
<div class="line" id="t6"><div class="url">meetezzy.com</div><div><span class="pill">Try it free</span></div></div>
<script>
var WIN=[[1.0, 2.88], [2.88, 9.78], [9.78, 11.35], [11.35, 12.86], [12.86, 15.29], [15.29, 23.57], [23.57, 27.94]];
var BLINKS=[2.2, 6.29, 10.38, 14.47, 18.56, 22.65, 26.74];
function ease(x){ return x<0?0:x>1?1:1-Math.pow(1-x,3); }
function seek(t){
  // face: scale in, gentle bob, blinks, smile grows at the end
  var sc=0.6+0.4*ease(t/0.9), bob=Math.sin(t*1.6)*8;
  var f=document.getElementById('face'); f.style.transform='translateY('+bob+'px) scale('+sc+')'; f.style.opacity=Math.min(1,t/0.5);
  var blink=1; BLINKS.forEach(function(b){ var d=t-b; if(d>=0&&d<0.18) blink=Math.abs(d-0.09)/0.09; });
  var eyes=document.getElementById('eyes'); eyes.setAttribute('transform','translate(0 '+(14.5*(1-blink))+') scale(1 '+Math.max(0.08,blink)+')');
  var grow=ease((t-15.29)/1.2); var cy=23.8+1.8*grow, dx=0.9*grow;
  document.getElementById('mouth').setAttribute('d','M '+(12.5-dx)+' 21 Q 16 '+cy+' '+(19.5+dx)+' 21');
  // eyes glance down toward the text while a line is on
  var glance=0; WIN.forEach(function(w,i){ if(i>0&&t>=w[0]&&t<w[1]) glance=1; });
  document.getElementById('eL').setAttribute('cy',14+0.5*glance); document.getElementById('eR').setAttribute('cy',15+0.5*glance);
  document.getElementById('brand').style.opacity=ease((t-3.6)/0.6);
  WIN.forEach(function(w,i){
    var el=document.getElementById('t'+i), a=w[0], b=w[1];
    var inA=ease((t-a)/0.4), outA=1-ease((t-(b-0.3))/0.3);
    var o=Math.min(inA,outA); if(t<a||t>=b) o=0;
    el.style.opacity=o; el.style.transform='translateY('+(24*(1-inA))+'px)';
  });
  // the brand mark fades out when the big wordmark is up
  if(t<3.6) document.getElementById('brand').style.opacity=0;
}
window.seek=seek; seek(0);
</script></body></html>
